# =============================================================
# render.yaml — "Receita" de publicação do SemeAR no Render (Blueprint).
#
# Cria três coisas, todas no plano gratuito:
#   semear-db ..... banco PostgreSQL
#   semear-api .... API (Node + Express + Prisma)
#   semear-front .. site do front-end (React, arquivos estáticos)
#
# Como usar: README → "Publicar no Render".
# =============================================================

databases:
  - name: semear-db
    databaseName: semear
    user: semear
    plan: free
    region: virginia

services:
  # ---------------------------------------------------------
  # API
  # ---------------------------------------------------------
  - type: web
    name: semear-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npx prisma generate
    # Ao ligar: aplica as migrations, garante as comunidades iniciais e sobe a API
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: semear-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # o Render sorteia uma chave forte
      # Endereço público do front (link do e-mail e CORS).
      # Ex.: https://semear-front.onrender.com
      - key: FRONT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # E-mail pelo Brevo (envio por HTTPS: o plano gratuito do Render pode bloquear SMTP).
      # Preencher no painel do Render; nunca no GitHub.
      - key: BREVO_API_KEY
        sync: false
      # Remetente confirmado no Brevo. Ex.: SemeAR <conta@gmail.com>
      - key: EMAIL_REMETENTE
        sync: false

  # ---------------------------------------------------------
  # Front-end
  # ---------------------------------------------------------
  - type: web
    name: semear-front
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # React Router: qualquer endereço (ex.: /redefinir-senha) abre o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Endereço público da API. Ex.: https://semear-api.onrender.com
      # É lido na hora do build: se mudar, faça um novo deploy do front.
      - key: VITE_API_URL
        sync: false
